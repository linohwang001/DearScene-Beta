name: Windows CI

on:
  push:
    branches: [ main, "release/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Compile and run DearScene tests
        shell: powershell
        run: .\tools\TestCore.ps1
